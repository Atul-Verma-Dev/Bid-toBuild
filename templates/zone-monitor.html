<!--
  ============================================================
  ZONE MONITORING COMPONENT
  Reusable operational monitoring section for the Omni View
  event command center.

  Use:
   1. Drop this block into an existing dashboard template.
   2. Load the static assets using the FastAPI/Jinja2 pattern:
        {{ url_for('static', path='/css/monitoring.css') }}
        {{ url_for('static', path='/js/monitoring.js') }}
   3. The module is fully scoped to .zone-monitor-module and only
      touches its own DOM.

  All dynamic content (zone cards, alerts, recommendations, staff
  deployment, simulation controls) is generated by
  static/js/monitoring.js from the mock state.
  ============================================================
-->
<section class="zone-monitor-module" aria-label="Zone monitoring">
  <div class="zone-monitor-module__header">
    <h1 class="zone-monitor-module__title">Zone Monitor</h1>
    <button class="zone-monitor-module__refresh" type="button">
      <span aria-hidden="true">↻</span>
      Refresh
    </button>
  </div>

  <div class="zone-monitor-module__grid" id="zone-monitor__grid">
    <!-- Zone cards are generated dynamically by monitoring.js -->
  </div>

  <div class="zone-monitor-module__panels" id="zone-monitor__panels">
    <!-- Overcrowding Alerts -->
    <div class="zone-monitor-module__alerts-panel" id="zone-monitor-alerts">
      <div class="zone-monitor-module__alerts-header">
        <h2 class="zone-monitor-module__alerts-title">Overcrowding Alerts</h2>
        <span class="zone-monitor-module__alerts-count" id="alert-count">0 active</span>
      </div>
      <div class="zone-monitor-module__alerts-list" id="alert-list">
        <!-- Alerts are rendered by monitoring.js -->
      </div>
    </div>

    <!-- Crowd Redirection Recommendations -->
    <div class="zone-monitor-module__recommendations-panel" id="zone-monitor-recommendations">
      <div class="zone-monitor-module__recommendations-header">
        <h2 class="zone-monitor-module__recommendations-title">Crowd Redirection</h2>
        <span class="zone-monitor-module__recommendations-count" id="recommendation-count">0 options</span>
      </div>
      <div class="zone-monitor-module__recommendations-list" id="recommendation-list">
        <!-- Recommendations are rendered by monitoring.js -->
      </div>
    </div>

    <!-- Staff Deployment -->
    <div class="zone-monitor-module__staff-panel" id="staff-panel">
      <div class="zone-monitor-module__staff-header">
        <h2 class="zone-monitor-module__staff-title">Staff Deployment</h2>
        <span class="zone-monitor-module__staff-count" id="staff-total">0 total</span>
      </div>

      <div class="zone-monitor-module__staff-summary">
        <div class="zone-monitor-module__staff-summary-card">
          <span class="zone-monitor-module__staff-summary-label">Total Staff</span>
          <span class="zone-monitor-module__staff-summary-value" id="staff-summary-total">0</span>
        </div>
        <div class="zone-monitor-module__staff-summary-card">
          <span class="zone-monitor-module__staff-summary-label">Available</span>
          <span class="zone-monitor-module__staff-summary-value zone-monitor-module__staff-summary-value--available" id="staff-summary-available">0</span>
        </div>
        <div class="zone-monitor-module__staff-summary-card">
          <span class="zone-monitor-module__staff-summary-label">Deployed</span>
          <span class="zone-monitor-module__staff-summary-value zone-monitor-module__staff-summary-value--deployed" id="staff-summary-deployed">0</span>
        </div>
        <div class="zone-monitor-module__staff-summary-card">
          <span class="zone-monitor-module__staff-summary-label">Busy</span>
          <span class="zone-monitor-module__staff-summary-value zone-monitor-module__staff-summary-value--busy" id="staff-summary-busy">0</span>
        </div>
      </div>

      <div class="zone-monitor-module__staff-grid" id="staff-grid">
        <!-- Staff zones are rendered by monitoring.js -->
      </div>
    </div>

    <!-- Crowd Simulation -->
    <div class="zone-monitor-module__simulation-panel" id="simulation-panel">
      <div class="zone-monitor-module__simulation-header">
        <h2 class="zone-monitor-module__simulation-title">Crowd Simulation</h2>
        <div class="zone-monitor-module__simulation-controls">
          <div class="zone-monitor-module__simulation-controls-group">
            <span class="zone-monitor-module__simulation-controls-label">Zone</span>
            <select class="zone-monitor-module__simulation-target-select" id="simulation-zone-select">
              <option value="1">Main Stage</option>
              <option value="2">Food Court</option>
              <option value="3">Gaming Arena</option>
              <option value="4">Exhibition Hall</option>
              <option value="5">Registration Area</option>
            </select>
          </div>
          <div class="zone-monitor-module__simulation-controls-group">
            <span class="zone-monitor-module__simulation-controls-label">Decrease</span>
            <button type="button" class="zone-monitor-module__simulation-controls-btn" data-simulation-action="decrease" data-step="10">-10</button>
            <button type="button" class="zone-monitor-module__simulation-controls-btn" data-simulation-action="decrease" data-step="50">-50</button>
          </div>
          <div class="zone-monitor-module__simulation-controls-group">
            <span class="zone-monitor-module__simulation-controls-label">Increase</span>
            <button type="button" class="zone-monitor-module__simulation-controls-btn" data-simulation-action="increase" data-step="10">+10</button>
            <button type="button" class="zone-monitor-module__simulation-controls-btn" data-simulation-action="increase" data-step="50">+50</button>
          </div>
          <div class="zone-monitor-module__simulation-controls-group">
            <button type="button" class="zone-monitor-module__simulation-controls-btn zone-monitor-module__simulation-controls-btn--surge" id="simulation-surge">
              SIMULATE CROWD SURGE
            </button>
          </div>
        </div>
      </div>

      <div class="zone-monitor-module__simulation-active" id="simulation-active">
        <div class="zone-monitor-module__simulation-active-top">
          <span class="zone-monitor-module__simulation-active-name" id="simulation-active-name">Main Stage</span>
          <span class="zone-monitor-module__simulation-active-status" id="simulation-active-status">SAFE</span>
        </div>

        <div class="zone-monitor-module__simulation-active-meta">
          <span>Current occupancy <strong id="simulation-active-occupancy">0 / 0</strong></span>
          <span>Occupancy percentage <strong id="simulation-active-percentage">0%</strong></span>
          <span>Crowd growth rate <strong id="simulation-active-growth">0 people/min</strong></span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Dependencies -->
<link
  rel="stylesheet"
  href="{{ url_for('static', path='/css/monitoring.css') }}"
>
<script src="{{ url_for('static', path='/js/monitoring.js') }}"></script>
